<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SzCloud API Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; }
    h1 { font-size: 1.2rem; color: #7c8aff; margin-bottom: 0.8rem; padding: 1rem 1rem 0; }

    /* ── Explorer ── */
    .explorer { background: #12121e; border-bottom: 1px solid #2a2a4a; padding: 1rem; }
    .breadcrumb { display: flex; align-items: center; gap: 0.3rem; margin-bottom: 0.8rem; font-size: 0.8rem; flex-wrap: wrap; }
    .breadcrumb span { cursor: pointer; color: #7c8aff; }
    .breadcrumb span:hover { text-decoration: underline; }
    .breadcrumb .sep { color: #555; cursor: default; }
    .breadcrumb .current { color: #e0e0e0; cursor: default; }
    .explorer-bar { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; flex-wrap: wrap; align-items: center; }
    .explorer-bar input { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.8rem; }
    .explorer-bar button { background: #4a5aff; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .explorer-bar button:hover { background: #5a6aff; }
    .explorer-bar button.sm { padding: 0.3rem 0.5rem; font-size: 0.7rem; background: #333; }
    .explorer-bar button.sm:hover { background: #444; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.6rem; }
    .file-item { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 0.8rem 0.6rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; position: relative; }
    .file-item:hover { border-color: #4a5aff; background: #1e1e36; }
    .file-item.selected { border-color: #7c8aff; background: #1e1e36; }
    .file-item .icon { font-size: 2rem; margin-bottom: 0.4rem; }
    .file-item .name { font-size: 0.75rem; word-break: break-word; line-height: 1.3; }
    .file-item .meta { font-size: 0.65rem; color: #666; margin-top: 0.3rem; }
    .file-item .actions { position: absolute; top: 4px; right: 4px; display: none; gap: 2px; }
    .file-item:hover .actions { display: flex; }
    .file-item .actions button { background: #333; color: #ccc; border: none; border-radius: 3px; width: 22px; height: 22px; font-size: 0.7rem; cursor: pointer; padding: 0; }
    .file-item .actions button:hover { background: #555; }
    .file-item .actions button.del:hover { background: #c0392b; color: #fff; }
    .empty-msg { color: #555; font-size: 0.85rem; text-align: center; padding: 2rem; }
    .detail-panel { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 1rem; margin-top: 0.8rem; display: none; }
    .detail-panel.show { display: block; }
    .detail-panel h3 { font-size: 0.85rem; color: #9aa4ff; margin-bottom: 0.5rem; }
    .detail-panel .field { font-size: 0.75rem; margin: 0.3rem 0; }
    .detail-panel .field span { color: #888; }
    .detail-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem; }
    .detail-actions button { padding: 0.35rem 0.7rem; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; }
    .detail-actions .btn-primary { background: #4a5aff; color: #fff; }
    .detail-actions .btn-danger { background: #c0392b; color: #fff; }
    .detail-actions .btn-secondary { background: #333; color: #ccc; }
    .pagination { display: flex; gap: 0.4rem; justify-content: center; margin-top: 0.8rem; }
    .pagination button { background: #333; color: #ccc; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .pagination button:hover { background: #4a5aff; color: #fff; }
    .pagination button:disabled { opacity: 0.3; cursor: default; }
    .pagination .page-info { font-size: 0.75rem; color: #888; align-self: center; }
    .storage-bar { margin-top: 0.6rem; }
    .storage-bar-bg { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    .storage-bar-fill { height: 100%; background: #4a5aff; border-radius: 3px; transition: width 0.3s; }
    .storage-bar-text { font-size: 0.7rem; color: #888; margin-top: 0.2rem; }

    /* ── Panels grid ── */
    .panels { padding: 1rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 1rem; }
    .panel h2 { font-size: 0.85rem; color: #9aa4ff; margin-bottom: 0.6rem; border-bottom: 1px solid #2a2a4a; padding-bottom: 0.3rem; }
    label { display: block; font-size: 0.72rem; color: #888; margin-top: 0.4rem; }
    input, select, textarea { width: 100%; background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; padding: 0.35rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-top: 0.15rem; }
    textarea { min-height: 50px; font-family: monospace; font-size: 0.72rem; resize: vertical; }
    button { background: #4a5aff; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.78rem; margin-top: 0.5rem; }
    button:hover { background: #5a6aff; }
    button.danger { background: #c0392b; }
    button.danger:hover { background: #e74c3c; }
    .row { display: flex; gap: 0.4rem; align-items: flex-end; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 70px; }
    #log { background: #0a0a14; border: 1px solid #222; border-radius: 6px; padding: 0.7rem; margin: 1rem; font-family: monospace; font-size: 0.72rem; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
    .log-ok { color: #4caf50; }
    .log-err { color: #e74c3c; }
    .log-info { color: #666; }
    .status { font-size: 0.65rem; padding: 0.12rem 0.35rem; border-radius: 3px; margin-left: 0.4rem; }
    .status.connected { background: #1b5e20; color: #81c784; }
    .status.disconnected { background: #4a1a1a; color: #e57373; }
    #token-display { font-size: 0.65rem; color: #555; word-break: break-all; margin-top: 0.3rem; min-height: 1rem; }
    .toast { position: fixed; bottom: 1rem; right: 1rem; background: #1a1a2e; border: 1px solid #4a5aff; color: #e0e0e0; padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.8rem; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<h1>SzCloud API Test <span id="status-badge" class="status disconnected">sin token</span></h1>

<!-- ═══ EXPLORER ═══ -->
<div class="explorer">
  <div class="breadcrumb" id="breadcrumb">
    <span onclick="browseRoot()">Raíz</span>
  </div>
  <div class="explorer-bar">
    <button onclick="browseRoot()">Refrescar</button>
    <input id="new-folder-name" placeholder="Nueva carpeta..." style="width:180px">
    <button onclick="createFolderBrowser()">+ Carpeta</button>
    <label style="margin:0;font-size:0.75rem;color:#888">Subir:</label>
    <input id="upload-file-input" type="file" style="width:auto;background:transparent;border:none;padding:0">
    <button onclick="uploadFileBrowser()">+ Archivo</button>
    <button class="sm" onclick="loadStorageInfo()">ℹ Info</button>
  </div>
  <div id="storage-info-bar" class="storage-bar" style="display:none">
    <div class="storage-bar-bg"><div class="storage-bar-fill" id="storage-fill" style="width:0%"></div></div>
    <div class="storage-bar-text" id="storage-text"></div>
  </div>
  <div id="file-grid" class="file-grid"></div>
  <div id="pagination" class="pagination"></div>
  <div id="detail-panel" class="detail-panel"></div>
</div>

<!-- ═══ API PANELS ═══ -->
<div class="panels">
<div class="grid">

  <!-- AUTH -->
  <div class="panel">
    <h2>Auth</h2>
    <label>Nombre</label>
    <input id="auth-name" value="Test User">
    <label>Email</label>
    <input id="auth-email" value="test@test.com">
    <label>Contraseña</label>
    <input id="auth-pass" type="password" value="password123">
    <div class="row">
      <button onclick="doRegister()">Register</button>
      <button onclick="doLogin()">Login</button>
      <button onclick="doLogout()" class="danger">Logout</button>
    </div>
    <button onclick="doMe()">GET /me</button>
    <button onclick="doRefresh()">POST /refresh</button>
    <div id="token-display"></div>
  </div>

  <!-- CUSTOM REQUEST -->
  <div class="panel">
    <h2>Custom Request</h2>
    <label>Método</label>
    <select id="custom-method">
      <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
    </select>
    <label>Ruta (/api/...)</label>
    <input id="custom-path" value="/api/me">
    <label>Body (JSON)</label>
    <textarea id="custom-body"></textarea>
    <button onclick="customRequest()">Enviar</button>
  </div>

</div>
</div>

<div id="log"></div>
<div id="toast" class="toast"></div>

<script>
const API = '/api';
let token = null;
let currentFolderId = null; // null = root
let currentPage = { folders: 1, files: 1 };
let currentItems = { folders: [], files: [] };

const $ = id => document.getElementById(id);
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); };

function log(msg, cls = '') {
  const el = $('log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = msg;
  el.prepend(line);
  if (el.children.length > 200) el.lastChild.remove();
}
function logJson(label, data, ok = true) { log(`${label} ${JSON.stringify(data, null, 2).substring(0, 500)}`, ok ? 'log-ok' : 'log-err'); }

function updateStatus() {
  const b = $('status-badge');
  const d = $('token-display');
  if (token) {
    b.textContent = 'conectado'; b.className = 'status connected';
    d.textContent = token.substring(0, 40) + '...';
  } else {
    b.textContent = 'sin token'; b.className = 'status disconnected';
    d.textContent = '';
  }
}

// ── API helper ──
async function api(method, path, body = null, isForm = false) {
  const opts = { method, headers: {}, credentials: 'same-origin' };
  if (token) opts.headers['Authorization'] = `Bearer ${token}`;
  if (body && !isForm) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  else if (body && isForm) { opts.body = body; }
  log(`> ${method} ${path}`, 'log-info');
  try {
    const res = await fetch(`${API}${path}`, opts);
    const ct = res.headers.get('content-type') || '';
    const data = ct.includes('json') ? await res.json() : await res.text();
    if (!res.ok) { logJson(`[${res.status}]`, data, false); return null; }
    logJson(`[${res.status}]`, data);
    return data;
  } catch (e) { log(`Error: ${e.message}`, 'log-err'); return null; }
}

// ── Auth ──
async function doRegister() {
  const d = await api('POST', '/register', {
    name: $('auth-name').value, email: $('auth-email').value,
    password: $('auth-pass').value, password_confirmation: $('auth-pass').value,
  });
  if (d?.access_token) { token = d.access_token; updateStatus(); toast('Registrado'); browseRoot(); }
}
async function doLogin() {
  const d = await api('POST', '/login', { email: $('auth-email').value, password: $('auth-pass').value });
  if (d?.access_token) { token = d.access_token; updateStatus(); toast('Logueado'); browseRoot(); }
}
async function doLogout() {
  await api('POST', '/logout');
  token = null; updateStatus(); toast('Desconectado');
  $('file-grid').innerHTML = ''; $('detail-panel').classList.remove('show');
}
async function doMe() { await api('GET', '/me'); }
async function doRefresh() { const d = await api('POST', '/refresh'); if (d?.access_token) { token = d.access_token; updateStatus(); toast('Token renovado'); } }

// ── Storage info ──
async function loadStorageInfo() {
  const d = await api('GET', '/storage/info');
  if (!d) return;
  const bar = $('storage-info-bar');
  bar.style.display = 'block';
  const used = d.used_bytes || d.used || 0;
  const limit = d.limit_bytes || d.limit || 1;
  const pct = Math.min(100, (used / limit * 100)).toFixed(1);
  $('storage-fill').style.width = pct + '%';
  $('storage-fill').style.background = pct > 90 ? '#c0392b' : '#4a5aff';
  const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : b < 1073741824 ? (b/1048576).toFixed(1) + ' MB' : (b/1073741824).toFixed(2) + ' GB';
  $('storage-text').textContent = `${fmt(used)} / ${fmt(limit)} (${pct}%) — Plan: ${d.plan || d.plan_name || 'free'}`;
}

// ═══ BROWSER ═══
const FOLDER_ICON = '📁';
const FILE_ICONS = {
  pdf:'📄', doc:'📝', docx:'📝', txt:'📃', md:'📃',
  jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️',
  mp3:'🎵', wav:'🎵', ogg:'🎵',
  mp4:'🎬', avi:'🎬', mkv:'🎬', mov:'🎬',
  zip:'📦', rar:'📦', '7z':'📦', tar:'📦', gz:'📦',
  js:'📜', ts:'📜', py:'📜', go:'📜', rs:'📜', php:'📜', html:'📜', css:'📜',
  json:'📋', xml:'📋', yaml:'📋', yml:'📋',
  exe:'⚙️', dmg:'⚙️', msi:'⚙️',
};
function fileIcon(ext, mime) {
  if (ext && FILE_ICONS[ext.toLowerCase()]) return FILE_ICONS[ext.toLowerCase()];
  if (mime && mime.startsWith('image/')) return '🖼️';
  if (mime && mime.startsWith('video/')) return '🎬';
  if (mime && mime.startsWith('audio/')) return '🎵';
  if (mime && mime.includes('pdf')) return '📄';
  if (mime && (mime.includes('json') || mime.includes('xml'))) return '📋';
  return '📄';
}
function fmtSize(b) {
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}

async function browseFolder(folderId, page = 1) {
  if (!token) return toast('Primero hacé login');
  currentFolderId = folderId;
  const path = folderId ? `/storage/folder/content/${folderId}` : '/storage/folder/content';
  const d = await api('GET', `${path}?page=${page}&per_page=20`);
  if (!d) return;

  currentItems.folders = d.folders || [];
  currentItems.files = d.files || [];
  renderBreadcrumb(folderId, d);
  renderGrid(d);
  renderPagination(d);
  $('detail-panel').classList.remove('show');
}

function browseRoot() { browseFolder(null); }

function renderBreadcrumb(folderId, data) {
  const bc = $('breadcrumb');
  bc.innerHTML = '';
  const root = document.createElement('span');
  root.textContent = '🏠 Raíz';
  root.onclick = () => browseFolder(null);
  bc.appendChild(root);

  // Build path from current folder — we'll try to get the name from current items or just show ID
  if (folderId) {
    // We don't have parent chain info, so we show the current folder name from its parent_id context
    // Simple approach: show current folder as "current"
    const sep = document.createElement('span');
    sep.className = 'sep'; sep.textContent = '/';
    bc.appendChild(sep);

    // Try to find the folder name from a previous navigation or use a generic label
    const span = document.createElement('span');
    span.className = 'current';
    span.textContent = `📂 ${folderId.substring(0, 8)}...`;
    span.title = folderId;
    bc.appendChild(span);
  }
}

function renderGrid(data) {
  const grid = $('file-grid');
  grid.innerHTML = '';
  const folders = currentItems.folders;
  const files = currentItems.files;

  if (folders.length === 0 && files.length === 0) {
    grid.innerHTML = '<div class="empty-msg">Carpeta vacía</div>';
    return;
  }

  folders.forEach(f => {
    const el = document.createElement('div');
    el.className = 'file-item';
    el.innerHTML = `
      <div class="icon">${FOLDER_ICON}</div>
      <div class="name">${esc(f.name)}</div>
      <div class="meta">${fmtDate(f.created_at)}</div>
      <div class="actions">
        <button title="Info" onclick="event.stopPropagation();showDetail('folder','${f.id}')">ℹ</button>
        <button title="Renombrar" onclick="event.stopPropagation();promptRename('folder','${f.id}','${esc(f.name)}')">✏</button>
        <button class="del" title="Eliminar" onclick="event.stopPropagation();deleteItem('folder','${f.id}')">✕</button>
      </div>`;
    el.onclick = () => browseFolder(f.id);
    grid.appendChild(el);
  });

  files.forEach(f => {
    const ext = (f.extension || '').replace('.', '');
    const el = document.createElement('div');
    el.className = 'file-item';
    el.innerHTML = `
      <div class="icon">${fileIcon(ext, f.mime_type)}</div>
      <div class="name">${esc(f.original_name)}</div>
      <div class="meta">${fmtSize(f.size)} · ${ext || '?'} · ${fmtDate(f.created_at)}</div>
      <div class="actions">
        <button title="Info" onclick="event.stopPropagation();showDetail('file','${f.id}')">ℹ</button>
        <button title="Download" onclick="event.stopPropagation();downloadFileBrowser('${f.id}')">⬇</button>
        <button class="del" title="Eliminar" onclick="event.stopPropagation();deleteItem('file','${f.id}')">✕</button>
      </div>`;
    el.onclick = () => showDetail('file', f.id);
    grid.appendChild(el);
  });
}

function renderPagination(data) {
  const pg = $('pagination');
  pg.innerHTML = '';
  const fp = data.pagination?.files;
  if (!fp || fp.last_page <= 1) return;

  const prev = document.createElement('button');
  prev.textContent = '← Ant';
  prev.disabled = fp.current_page <= 1;
  prev.onclick = () => browseFolder(currentFolderId, fp.current_page - 1);
  pg.appendChild(prev);

  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `Pág ${fp.current_page} / ${fp.last_page} (${fp.total} archivos)`;
  pg.appendChild(info);

  const next = document.createElement('button');
  next.textContent = 'Sig →';
  next.disabled = fp.current_page >= fp.last_page;
  next.onclick = () => browseFolder(currentFolderId, fp.current_page + 1);
  pg.appendChild(next);
}

// ── Detail panel ──
async function showDetail(type, id) {
  const panel = $('detail-panel');
  panel.classList.add('show');
  panel.innerHTML = '<div style="color:#666">Cargando...</div>';

  const d = type === 'folder'
    ? await api('GET', `/storage/folder/${id}`)
    : await api('GET', `/storage/file/${id}`);

  if (!d) { panel.classList.remove('show'); return; }

  let html = `<h3>${type === 'folder' ? '📁' : '📄'} ${esc(d.name || d.original_name || id)}</h3>`;
  const fields = type === 'folder'
    ? [['ID', d.id], ['Nombre', d.name], ['Parent', d.parent_id || '— (raíz)'], ['Creado', fmtDate(d.created_at)], ['Actualizado', fmtDate(d.updated_at)]]
    : [['ID', d.id], ['Nombre', d.original_name], ['Tipo', d.mime_type], ['Extensión', d.extension], ['Tamaño', fmtSize(d.size)], ['Folder', d.folder_id || '— (raíz)'], ['Creado', fmtDate(d.created_at)], ['Actualizado', fmtDate(d.updated_at)]];

  fields.forEach(([k, v]) => html += `<div class="field"><span>${k}:</span> ${esc(String(v ?? '—'))}</div>`);

  if (type === 'file') {
    html += `<div class="detail-actions">
      <button class="btn-primary" onclick="downloadFileBrowser('${d.id}')">⬇ Download</button>
      <button class="btn-secondary" onclick="promptRename('file','${d.id}','${esc(d.original_name)}')">✏ Renombrar</button>
      <button class="btn-secondary" onclick="showVersions('${d.id}')">📋 Versiones</button>
      <button class="btn-secondary" onclick="showActivity('${d.id}')">📜 Actividad</button>
      <button class="btn-danger" onclick="deleteItem('file','${d.id}')">🗑 Eliminar</button>
    </div>`;
  } else {
    html += `<div class="detail-actions">
      <button class="btn-primary" onclick="browseFolder('${d.id}')">📂 Abrir</button>
      <button class="btn-secondary" onclick="promptRename('folder','${d.id}','${esc(d.name)}')">✏ Renombrar</button>
      <button class="btn-danger" onclick="deleteItem('folder','${d.id}')">🗑 Eliminar</button>
    </div>`;
  }

  panel.innerHTML = html;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Versions / Activity as simple toasts/logs ──
async function showVersions(id) {
  const d = await api('GET', `/storage/file/${id}/versions`);
  if (!d) return;
  log(`Versiones del archivo:\n${JSON.stringify(d, null, 2)}`, 'log-ok');
  toast(`${Array.isArray(d) ? d.length : '?'} versiones encontradas`);
}
async function showActivity(id) {
  const d = await api('GET', `/storage/file/${id}/activity`);
  if (!d) return;
  log(`Actividad del archivo:\n${JSON.stringify(d, null, 2)}`, 'log-ok');
  toast(`${Array.isArray(d) ? d.length : '?'} registros de actividad`);
}

// ── Browser actions ──
async function createFolderBrowser() {
  const name = $('new-folder-name').value.trim();
  if (!name) return toast('Escribí un nombre');
  const body = { name };
  if (currentFolderId) body.parent_id = currentFolderId;
  const d = await api('POST', '/storage/folder', body);
  if (d) { toast('Carpeta creada'); $('new-folder-name').value = ''; browseFolder(currentFolderId); }
}

async function uploadFileBrowser() {
  const file = $('upload-file-input').files[0];
  if (!file) return toast('Seleccioná un archivo');
  const fd = new FormData();
  fd.append('file', file);
  if (currentFolderId) fd.append('folder_id', currentFolderId);
  const d = await api('POST', '/storage/file', fd, true);
  if (d) { toast('Archivo subido'); browseFolder(currentFolderId); }
}

async function downloadFileBrowser(id) {
  const d = await api('GET', `/storage/file/${id}/download`);
  if (d?.url) window.open(d.url, '_blank');
}

async function deleteItem(type, id) {
  if (!confirm(`¿Eliminar ${type}?`)) return;
  const d = type === 'folder'
    ? await api('DELETE', `/storage/folder/${id}`)
    : await api('DELETE', `/storage/file/${id}`);
  if (d) { toast('Eliminado'); browseFolder(currentFolderId); }
}

function promptRename(type, id, currentName) {
  const newName = prompt(`Nuevo nombre:`, currentName);
  if (!newName || newName === currentName) return;
  const endpoint = type === 'folder' ? `/storage/folder/${id}/rename` : `/storage/file/${id}/rename`;
  api('PATCH', endpoint, { name: newName }).then(d => {
    if (d) { toast('Renombrado'); browseFolder(currentFolderId); }
  });
}

// ── Helpers ──
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDate(s) { if (!s) return ''; try { return new Date(s).toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'2-digit' }); } catch { return s; } }

// ── Custom request ──
async function customRequest() {
  const method = $('custom-method').value;
  const path = $('custom-path').value.trim();
  let body = $('custom-body').value.trim();
  if (body) { try { body = JSON.parse(body); } catch { return log('JSON inválido', 'log-err'); } }
  await api(method, path, body || null);
}

// ── Init ──
updateStatus();
if (token) browseRoot();
</script>
